version: '3.8'

services:
  xai-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xai-explainability-api
    ports:
      - "5000:5000"
    environment:
      - XAI_HOST=0.0.0.0
      - XAI_PORT=5000
      - XAI_DEBUG=false
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Development service with hot reload
  xai-api-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xai-explainability-api-dev
    ports:
      - "5001:5000"
    environment:
      - XAI_HOST=0.0.0.0
      - XAI_PORT=5000
      - XAI_DEBUG=true
    volumes:
      - ./xai_core:/app/xai_core
      - ./api:/app/api
      - ./run.py:/app/run.py
    command: uvicorn api.app:app --host 0.0.0.0 --port 5000 --reload
    profiles:
      - dev
